<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE OBSERVATORY — Telescopes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="iso-bg" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 44 44" width="36" height="36" aria-hidden="true">
          <polygon points="6,30 16,26 30,33 22,37" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <line x1="11" y1="28" x2="26" y2="35" stroke="currentColor" stroke-width="1" opacity=".5"/>
          <line x1="19" y1="35" x2="14" y2="43" stroke="currentColor" stroke-width="1.2"/>
          <line x1="21" y1="35" x2="26" y2="43" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="32" cy="13" r="2" fill="currentColor"/>
          <line x1="30" y1="33" x2="32" y2="15" stroke="currentColor" stroke-width="1.3"/>
          <line x1="32" y1="13" x2="40" y2="9" stroke="currentColor" stroke-width="1" opacity=".5"/>
          <line x1="32" y1="13" x2="39" y2="16" stroke="currentColor" stroke-width="1" opacity=".5"/>
        </svg>
      </div>
      <div class="brand-txt">
        <h1 id="wordmark">OBSERVATORY</h1>
        <p class="tag" id="tagline">SELECT AN INSTRUMENT</p>
        <nav class="tabs" id="tabs">
          <button class="tab active" data-view="board">BOARD</button>
          <button class="tab" data-view="feed">WHAT'S NEW</button>
          <button class="tab" data-view="scopes">TELESCOPES</button>
          <button class="tab" data-view="roadmap">ROADMAP</button>
        </nav>
      </div>
    </div>
    <div class="actions">
      <div class="readout" id="freshness">—</div>
      <button id="refresh" class="btn">↻ REFRESH</button>
    </div>
  </header>

  <!-- instrument switcher -->
  <div class="scope-strip" id="scope-strip"></div>

  <main>
    <!-- ════════════ BOARD ════════════ -->
    <div class="view" id="view-board">
      <div class="caveat" id="caveat" hidden></div>

      <section class="podium-section">
        <div class="section-label"><span>01</span> <em id="podium-label">TOP RANKED · BLENDED SCORE</em></div>
        <div id="podium" class="podium"></div>
      </section>

      <section class="controls">
        <div class="section-label"><span>02</span> WEIGHTING MATRIX</div>
        <div class="control-row">
          <div class="field">
            <span class="field-mark">⌕</span>
            <input id="search" class="search" type="text" placeholder="FILTER" autocomplete="off" />
          </div>
          <label class="chk"><input type="checkbox" id="hide-noise" checked /> HIDE NOISE</label>
          <label class="chk"><input type="checkbox" id="scored-only" /> SCORED ONLY</label>
          <div class="spacer"></div>
          <button id="reset-weights" class="btn ghost">RESET WEIGHTS</button>
        </div>
        <div class="weights" id="weights"></div>
      </section>

      <section>
        <div class="section-label"><span>03</span> <em id="table-label">FULL INDEX</em></div>
        <div class="table-wrap">
          <table id="main-table">
            <thead><tr id="thead-row"></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="status" id="status"></div>
      </section>

      <div id="panels-container"></div>
    </div>

    <!-- ════════════ FEED ════════════ -->
    <div class="view" id="view-feed" hidden>
      <section class="feed-section">
        <div class="section-label"><span>01</span> DETECTED EVENTS · ALL ENABLED TELESCOPES</div>
        <div id="feed" class="feed"></div>
      </section>
    </div>

    <!-- ════════════ TELESCOPES ════════════ -->
    <div class="view" id="view-scopes" hidden>
      <section>
        <div class="section-label"><span>01</span> INSTRUMENTS · TOGGLE TO ENABLE</div>
        <div class="scope-grid" id="scope-grid"></div>
        <div class="status">A DISABLED TELESCOPE IS NEVER FETCHED AND NEVER POLLED.</div>
      </section>
    </div>

    <!-- ════════════ ROADMAP ════════════ -->
    <div class="view" id="view-roadmap" hidden>
      <section>
        <div class="section-label"><span>01</span> FEATURE ROADMAP</div>
        <div id="roadmap" class="roadmap"></div>
      </section>
    </div>
  </main>

  <div class="calc-tip" id="calc-tip" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
